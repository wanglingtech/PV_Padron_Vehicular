  <text x="109" y="536.48" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="400" fill="#62748e" text-anchor="start">Genere copias de respaldo o reportes completos listos para imprimir o remitir a la autoridad de transporte.</text>
  <text x="57" y="582.48" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="400" fill="#45556c" text-anchor="start">El archivo exportado contiene todas las secciones: datos del vehículo, propietarios principales y co-propietarios, datos del conductor, estado de AFOCAT/SOAT, revisiones técnicas CITV, cursos de educación vial y licencias B-II-C.</text>
